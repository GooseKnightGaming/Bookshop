<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Stock">
<title>Shop Stock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --ink:#1D2B2A; --muted:#5F6A66; --line:#D9DDD5;
  --green:#2E5E4E; --green-ink:#FFFFFF; --green-soft:#E3ECE7;
  --out:#9E2A3A; --out-soft:#F5E4E6; --warn-soft:#FBF1D9; --warn-ink:#6B4E0C;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131918; --surface:#1B2322; --ink:#E6ECE9; --muted:#9AA6A1; --line:#2D3836;
    --green:#7DB89F; --green-ink:#0F1F19; --green-soft:#1F3029;
    --out:#E58893; --out-soft:#3A2226; --warn-soft:#3A3120; --warn-ink:#F1D79A;
  }
}
:root[data-theme="dark"]{
  --paper:#131918; --surface:#1B2322; --ink:#E6ECE9; --muted:#9AA6A1; --line:#2D3836;
  --green:#7DB89F; --green-ink:#0F1F19; --green-soft:#1F3029;
  --out:#E58893; --out-soft:#3A2226; --warn-soft:#3A3120; --warn-ink:#F1D79A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 140px}

header h1{font:650 30px/1.1 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin:0}
.stats b{color:var(--ink);font-size:17px}

.sync{margin:6px 0 0;font-size:14px;color:var(--green)}
.sync.warn{color:var(--out)}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);font-size:15px}
.banner[hidden]{display:none}
.banner button{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline}

.search{margin:20px 0 12px}
.search input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--green);outline:none}

.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:4px}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tabs span{font-weight:400;font-size:14px}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left}
.row .txt{flex:1;min-width:0}
.row .t,.row .a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{font:500 17px/1.3 var(--serif)}
.row .a{color:var(--muted);font-size:15px}
.row .sec{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.count{flex:none;min-width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-weight:700;background:var(--green-soft);color:var(--green)}
.count.many{background:var(--green);color:var(--green-ink)}
.gone{flex:none;text-align:right;font-size:13px;color:var(--out);line-height:1.2;min-width:62px}
.more{color:var(--muted);font-size:14px;padding:14px 2px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:500 19px/1.3 var(--serif);margin-bottom:6px}

.foot{margin-top:28px;display:flex;gap:6px 18px;flex-wrap:wrap}
.link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;min-height:52px}
.btn.primary{background:var(--green);color:var(--green-ink);flex:1}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.out{background:var(--out);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px}
.btn.big small{display:block;font-weight:400;color:var(--muted);font-size:14px}

.scrim{position:fixed;inset:0;background:rgba(10,15,14,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:650 23px/1.2 var(--serif);margin:0 0 4px}
.sheet .by{color:var(--muted);margin:0 0 14px}
.sheet .close{float:right;background:none;border:0;font-size:15px;color:var(--muted);padding:4px 0 8px 12px;text-decoration:underline}
.head{display:flex;gap:14px}
.head img{width:64px;height:96px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.status{font-size:19px;margin:6px 0 16px}
.status b{font-size:26px;font-family:var(--serif)}
.status.none{color:var(--out)}
.pair{display:flex;gap:10px;margin-bottom:18px}
.pair .btn{flex:1}
.note{padding:10px 12px;border-radius:10px;font-size:15px;margin:0 0 14px}
.note.dup{background:var(--warn-soft);color:var(--warn-ink)}
.note.info{background:var(--green-soft);color:var(--ink)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 16px;font-size:15px}
dt{color:var(--muted)}
dd{margin:0}
h3{font-size:15px;margin:18px 0 6px;color:var(--muted);font-weight:700}
.hist{list-style:none;margin:0 0 12px;padding:0;font-size:15px}
.hist li{padding:4px 0;border-bottom:1px dashed var(--line)}
.hist .o{color:var(--out)}
.actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.danger{color:var(--out)}
.cands{list-style:none;margin:0 0 12px;padding:0}
.cands button{width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cands b{font-family:var(--serif);font-weight:500;display:block}
.cands span{color:var(--muted);font-size:14px}
details{font-size:14px;color:var(--muted);margin:8px 0 12px}
details pre{white-space:pre-wrap;font:13px/1.4 var(--sans);background:var(--paper);padding:10px;border-radius:8px;max-height:200px;overflow:auto}

.reading{display:flex;align-items:center;gap:10px;color:var(--muted);margin:4px 0 14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

form label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 4px}
form input,form select,form textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:17px}
form textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.formbtns .btn{flex:1}

.scanner{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.scanner[hidden]{display:none}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .guide{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none}
.scanner .msg{position:absolute;left:0;right:0;top:calc(18% + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;padding:0 20px}
.scanner .ctrl{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.scanner .ctrl .btn{flex:1;background:#2b2b2b;color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:40;max-width:calc(100% - 32px);font-size:15px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shop Stock</h1>
    <p class="stats" id="stats"></p>
    <p class="sync" id="sync" hidden></p>
  </header>
  <p class="banner" id="banner" hidden></p>

  <div class="search">
    <label for="q" class="vh">Search by title, author, genre, publisher or barcode</label>
    <input id="q" type="search" placeholder="Search title, author, genre…" autocomplete="off">
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="all" aria-selected="true">All <span id="n-all"></span></button>
    <button role="tab" data-tab="in" aria-selected="false">In stock <span id="n-in"></span></button>
    <button role="tab" data-tab="gone" aria-selected="false">Gone <span id="n-gone"></span></button>
  </div>
  <ul class="list" id="list"></ul>

  <div class="foot">
    <button class="link" id="backup">Back up</button>
    <button class="link" id="restore">Restore or import</button>
    <button class="link" id="csv">Download spreadsheet (CSV)</button>
    <button class="link" id="sharing">Sharing</button>
  </div>
</div>

<div class="bar"><div class="in">
  <button class="btn primary" id="scan">Scan barcode</button>
  <button class="btn ghost" id="more">Photo or type</button>
</div></div>

<div class="scanner" id="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div class="guide"></div>
  <p class="msg" id="scan-msg">Point at the barcode</p>
  <div class="ctrl">
    <button class="btn" id="scan-cancel">Cancel</button>
    <button class="btn" id="scan-photo">Use a photo instead</button>
  </div>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="importer" accept=".json,.csv,application/json,text/csv" hidden>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>

<script>
(() => {
"use strict";

/* ================= settings you can edit ================= */
const SECTIONS = [
  ["AF","Adult Fiction"],["MT","Major Thrillers"],["WA","Women Authors"],["WC","Women Crime Authors"],
  ["CL","Classics"],["OB","Old Books"],["NF","Non-Fiction"],["WT","Wartime Stories"],["WH","Western / Horseman"],
  ["CR","Crafts"],["GP","Games, Jigsaws & Puzzles"],["MG","Magazines"],["MP","Maps"],
  ["K1","Kids: Babies & Toddlers"],["K2","Kids: Young Readers"],["K3","Kids: Early Readers"],["K4","Kids: Confident Readers"],
  ["YA","YA Fiction"],["KN","Kids' Non-Fiction"],["MC","Corner of Miscellany"]
];
// Surnames that go straight to Major Thrillers
const MAJOR_THRILLERS = ["rankin","francis","clancy","child","grisham","patterson","baldacci","forsyth","ludlum","maclean","cussler","connelly","higgins","archer","koontz","brown","reacher"];
const KINDS = ["Book","Jigsaw","Puzzle book","Game","Magazine","Map","Other"];
const SHOW_MAX = 300;
/* ========================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
  .replace(/^(the|a|an)\s+/, "").replace(/[^a-z0-9]+/g, " ").trim();
const keyOf = (t, a) => norm(t) + "|" + norm(a);
const surname = a => norm((a || "").split(/[,;&]| and /)[0]).split(" ").pop() || "";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"}); };
const nowISO = () => new Date().toISOString();
const secName = c => (SECTIONS.find(s => s[0] === c) || [, c || ""])[1];
const newId = () => "k-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ================= ISBN + page parsing ================= */
const fix = s => s.replace(/[Oo]/g,"0").replace(/[IlL|]/g,"1").replace(/[Ss]/g,"5").replace(/[Bb]/g,"8").replace(/[^0-9Xx]/g,"").toUpperCase();
function valid13(c){ if(!/^\d{13}$/.test(c)) return false; let s=0; for(let i=0;i<12;i++) s+=(+c[i])*(i%2?3:1); return (10-s%10)%10===+c[12]; }
function valid10(c){ if(!/^\d{9}[\dX]$/.test(c)) return false; let s=0; for(let i=0;i<10;i++) s+=(10-i)*(c[i]==="X"?10:+c[i]); return s%11===0; }
function to13(c10){ const b="978"+c10.slice(0,9); let s=0; for(let i=0;i<12;i++) s+=(+b[i])*(i%2?3:1); return b+((10-s%10)%10); }
const isISBN13 = c => /^97[89]\d{10}$/.test(c) && valid13(c);
function normIsbn(raw, sbn){
  let c = fix(raw);
  if (sbn && c.length===9) c = "0"+c;
  if (c.length===13 && valid13(c)) return c;
  if (c.length===10 && valid10(c)) return to13(c);
  return null;
}
function findISBNs(text){
  const out = new Set();
  const re = /(I?SBN)[^0-9OoIl]{0,8}([0-9OoIlSs][0-9OoIlSs\-\u2013 ]{7,20}[0-9Xx])/gi;
  let m;
  while ((m = re.exec(text))){
    const sbn = m[1].toUpperCase()==="SBN", digits = m[2];
    for (const len of [13,10,9]){
      let cnt=0, cut=0;
      for (; cut<digits.length && cnt<len; cut++) if (/[0-9OoIlSsXx]/.test(digits[cut])) cnt++;
      if (cnt===len){ const n = normIsbn(digits.slice(0,cut), sbn && len===9); if (n){ out.add(n); break; } }
    }
  }
  const re2 = /97[89][\d\-\u2013 ]{10,17}/g;
  while ((m = re2.exec(text))){ const c = m[0].replace(/[^\d]/g,"").slice(0,13); if (valid13(c)) out.add(c); }
  return [...out];
}
function parsePage(text){
  const t = text.replace(/\r/g,"");
  const yr = (t.match(/first published[^0-9]{0,80}?((?:1[5-9]|20)\d{2})/i) || t.match(/(?:©|\(c\)|copyright)[^0-9]{0,30}?((?:1[5-9]|20)\d{2})/i) || [])[1] || "";
  let pub = (t.match(/published (?:in [A-Za-z ]{3,30} )?by\s+([A-Z][^\n,;]{2,50})/) || [])[1] || "";
  if (!pub){ const line = t.split("\n").map(s=>s.trim()).find(s => /\b(Ltd|Limited|Press|Publishing|Publishers|& Co)\b/.test(s) && s.length < 60); if (line) pub = line; }
  const ed = (t.match(/\b((?:first|second|third|fourth|fifth|sixth|new|revised|\d+(?:st|nd|rd|th))\s+(?:edition|impression|printing))\b/i) || [])[1] || "";
  return {year: yr, publisher: pub.replace(/\s+/g," ").trim().replace(/\s+(?:in\s+)?(?:1[5-9]|20)\d{2}$/,"").replace(/[.]$/,""), edition: ed};
}
function queryFromText(text){
  const skip = /publish|copyright|isbn|printed|rights|reserved|edition|impression|library|catalogu|www\.|\.com|limited|ltd|press/i;
  const lines = text.split("\n").map(s => s.replace(/[^A-Za-z0-9'&\- ]+/g," ").replace(/\s+/g," ").trim())
    .filter(s => s.length >= 3 && s.length <= 60 && !skip.test(s) && (s.match(/[A-Za-z]/g) || []).length / s.length > 0.7);
  return lines.slice(0, 4).join(" ").slice(0, 90).trim();
}

/* ================= genre + section guesses ================= */
function genreFrom(subjects){
  const s = subjects.join(" | ").toLowerCase();
  const map = [[/detective|crime|mystery|murder/,"Crime fiction"],[/thriller|suspense|espionage|spy/,"Thriller"],[/science fiction/,"Science fiction"],
    [/fantasy/,"Fantasy"],[/horror/,"Horror"],[/romance|love stories/,"Romance"],[/historical fiction/,"Historical fiction"],
    [/world war|military|war\b/,"War & military"],[/biograph|memoir/,"Biography"],[/cook|recipe/,"Cookery"],[/travel/,"Travel"],
    [/juvenile|children/,"Children's"],[/poetry/,"Poetry"],[/history/,"History"],[/humou?r/,"Humour"],[/fiction/,"Fiction"]];
  for (const [re, g] of map) if (re.test(s)) return g;
  return (subjects[0] || "").slice(0, 30);
}
function suggestSection(f, subjects){
  const s = subjects.join(" | ").toLowerCase();
  if (f.kind === "Jigsaw" || f.kind === "Game" || f.kind === "Puzzle book") return "GP";
  if (f.kind === "Magazine") return "MG";
  if (f.kind === "Map") return "MP";
  if (/young adult/.test(s)) return "YA";
  if (/juvenile|children/.test(s)) return /nonfiction|non-fiction/.test(s) ? "KN" : "K4";
  if (f.year && +f.year < 1950) return "OB";
  if (/knitting|sewing|crochet|needlework|flower arrang|embroider/.test(s)) return "CR";
  if (/crossword|puzzle/.test(s)) return "GP";
  if (/western|horse/.test(s)) return "WH";
  if (/world war|war stories/.test(s)) return "WT";
  if (MAJOR_THRILLERS.includes(surname(f.author))) return "MT";
  if (/fiction|novel|stories/.test(s)) return "AF";
  return subjects.length ? "NF" : "";
}

/* ================= online lookups ================= */
async function getJSON(url){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) return null; return await r.json(); }
  catch { return null; } finally { clearTimeout(t); }
}
const yearOf = s => ((s || "").match(/(1[5-9]|20)\d{2}/) || [""])[0];
async function lookupISBN(isbn){
  let j = await getJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&jscmd=data&format=json`);
  let b = j && j["ISBN:" + isbn];
  if (b){
    const subjects = (b.subjects || []).map(x => x.name).slice(0, 20);
    return {title: b.title + (b.subtitle ? ": " + b.subtitle : ""), author: (b.authors || []).map(a => a.name).join(", "),
      publisher: b.publishers?.[0]?.name || "", year: yearOf(b.publish_date), subjects};
  }
  j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
  const v = j?.items?.[0]?.volumeInfo;
  if (v) return {title: v.title + (v.subtitle ? ": " + v.subtitle : ""), author: (v.authors || []).join(", "),
    publisher: v.publisher || "", year: yearOf(v.publishedDate), subjects: v.categories || []};
  return null;
}
async function searchBooks(q){
  const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=6&fields=title,author_name,first_publish_year,isbn,subject,publisher`);
  return (j?.docs || []).map(d => ({
    title: d.title || "", author: (d.author_name || []).slice(0, 2).join(", "), year: d.first_publish_year ? String(d.first_publish_year) : "",
    publisher: d.publisher?.[0] || "", subjects: (d.subject || []).slice(0, 20),
    isbn: (d.isbn || []).map(x => x.length === 10 && valid10(x) ? to13(x) : x).find(isISBN13) || ""
  }));
}
function fromLookup(r, extra = {}){
  const f = {kind: "Book", title: r.title || "", author: r.author || "", publisher: extra.publisher || r.publisher || "",
    year: extra.year || r.year || "", barcode: extra.barcode || "", notes: extra.notes || "", genre: genreFrom(r.subjects || [])};
  f.section = suggestSection(f, r.subjects || []);
  return f;
}

/* ================= storage (on this phone) ================= */
let idb = null;
const items = new Map();
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("shop-stock", 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("items")) db.createObjectStore("items", {keyPath: "id"});
      if (!db.objectStoreNames.contains("outbox")) db.createObjectStore("outbox", {autoIncrement: true});
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => { const t = idb.transaction(store, mode); fn(t.objectStore(store)); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
function outboxAll(){
  return new Promise((res, rej) => {
    const list = [], r = idb.transaction("outbox").objectStore("outbox").openCursor();
    r.onsuccess = () => { const c = r.result; if (c){ list.push({key: c.key, op: c.value}); c.continue(); } else res(list); };
    r.onerror = () => rej(r.error);
  });
}
let persistAsked = false;
async function putLocal(list){
  list = [].concat(list);
  for (const d of list) items.set(d.id, d);
  render();
  if (!persistAsked){ persistAsked = true; navigator.storage?.persist?.().catch(() => {}); }
  try { await tx("items", "readwrite", s => list.forEach(d => s.put(d))); }
  catch { banner("A change didn't save on this phone. Your storage may be full."); }
}
async function delLocal(ids){
  ids = [].concat(ids);
  for (const id of ids) items.delete(id);
  render();
  try { await tx("items", "readwrite", s => ids.forEach(id => s.delete(id))); } catch {}
}
async function queue(ops){
  if (!syncCfg) return;
  ops = [].concat(ops);
  try { await tx("outbox", "readwrite", s => ops.forEach(op => s.add(op))); } catch {}
  scheduleSync();
}

// The same rules run on the phone and in the Google Sheet script.
function applyAdjust(d, delta, at, undo){
  if (!delta) return false;
  d.count = +d.count || 0; d.inTotal = +d.inTotal || 0; d.outTotal = +d.outTotal || 0;
  d.log = Array.isArray(d.log) ? d.log : [];
  if (undo){
    const type = delta > 0 ? "out" : "in", i = d.log.findIndex(l => l.a === type);
    if (i >= 0) d.log.splice(i, 1);
    if (delta > 0){ d.count += delta; d.outTotal = Math.max(0, d.outTotal - delta); }
    else { d.count = Math.max(0, d.count + delta); d.inTotal = Math.max(0, d.inTotal + delta); }
    return true;
  }
  if (delta < 0 && d.count <= 0) return false;
  d.count = Math.max(0, d.count + delta);
  if (delta > 0){ d.inTotal += delta; d.lastIn = at; } else { d.outTotal -= delta; d.lastOut = at; }
  d.log = [{a: delta > 0 ? "in" : "out", n: Math.abs(delta), d: at}, ...d.log].slice(0, 25);
  return true;
}
function createItem(d){ putLocal(d); queue({t: "create", item: d}); }
function updateItem(id, fields){ putLocal({...items.get(id), ...fields, updated: nowISO()}); queue({t: "update", id, fields}); }
function deleteItem(id){ delLocal(id); queue({t: "delete", id}); }
function restoreItems(list){ list = [].concat(list); putLocal(list); queue(list.map(d => ({t: "restore", item: d}))); }
function adjustItem(id, delta, undo){
  const cur = items.get(id); if (!cur) return false;
  const d = structuredClone(cur), at = nowISO();
  if (!applyAdjust(d, delta, at, undo)) return false;
  d.updated = at;
  putLocal(d); queue({t: "adjust", id, delta, at, undo: !!undo});
  return true;
}
function adjust(id, delta){
  const title = items.get(id)?.title || "";
  if (!adjustItem(id, delta, false)) return;
  toast(delta > 0 ? `Added one: ${title}` : `Marked one out: ${title}`, () => {
    adjustItem(id, -delta, true);
    if (!$("#scrim").hidden && items.has(id)) showItem(id);
  });
}

/* ================= sharing between phones (Google Sheet) ================= */
let syncCfg = null;
try { syncCfg = JSON.parse(localStorage.getItem("syncCfg") || "null"); } catch {}
let since = +localStorage.getItem("syncSince") || 0;
let syncing = false, syncTimer = null, lastSync = 0, syncProblem = "";

async function post(url, payload){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(url, {method: "POST", body: JSON.stringify(payload), headers: {"Content-Type": "text/plain;charset=utf-8"}, redirect: "follow", signal: ctl.signal});
    if (!r.ok) throw new Error("http " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function fromServer(it){
  const d = {...it};
  delete d.deleted;
  for (const k of ["count","inTotal","outTotal"]) d[k] = parseInt(d[k], 10) || 0;
  if (typeof d.log === "string"){ try { d.log = JSON.parse(d.log); } catch { d.log = []; } }
  d.log = Array.isArray(d.log) ? d.log : [];
  d.lastOut = d.lastOut || null;
  d.key = keyOf(d.title, d.author);
  return d;
}
async function takeFromServer(list, skipIds = new Set()){
  const keep = [], gone = [];
  for (const it of list){ if (skipIds.has(it.id)) continue; (it.deleted ? gone : keep).push(it.deleted ? it.id : fromServer(it)); }
  if (keep.length) await putLocal(keep);
  if (gone.length) await delLocal(gone);
}
function scheduleSync(ms = 1500){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync(){
  if (!syncCfg || !idb) return;
  if (syncing){ scheduleSync(3000); return; }
  syncing = true;
  try {
    const box = await outboxAll(), batch = box.slice(0, 150), rest = box.slice(150);
    const res = await post(syncCfg.url, {secret: syncCfg.code, since, ops: batch.map(b => b.op)});
    if (!res?.ok){ syncProblem = res?.error === "bad_code" ? "The shop code doesn't match the sheet. Check it under Sharing." : "The sheet sent back an error."; return; }
    if (batch.length) await tx("outbox", "readwrite", s => batch.forEach(b => s.delete(b.key)));
    // Anything still waiting to send keeps this phone's version for now
    const later = await outboxAll();
    await takeFromServer(res.items || [], new Set(later.map(b => b.op.id || b.op.item?.id)));
    since = res.rev || since; localStorage.setItem("syncSince", String(since));
    lastSync = Date.now(); syncProblem = "";
    if (rest.length) scheduleSync(300);
  } catch { syncProblem = "offline"; }
  finally { syncing = false; showSyncStatus(); }
}
async function showSyncStatus(){
  const el = $("#sync");
  if (!syncCfg){ el.hidden = true; return; }
  el.hidden = false;
  const waiting = idb ? (await outboxAll().catch(() => [])).length : 0;
  const t = lastSync ? new Date(lastSync).toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"}) : "";
  if (syncProblem === "offline") el.textContent = `Shared list: can't reach the sheet right now.${waiting ? ` ${waiting} change${waiting > 1 ? "s" : ""} waiting to send.` : ""}`;
  else if (syncProblem) el.textContent = syncProblem;
  else el.textContent = waiting ? `Shared list: sending ${waiting} change${waiting > 1 ? "s" : ""}…` : `Shared list: up to date${t ? ` (checked ${t})` : ""}`;
  el.classList.toggle("warn", !!syncProblem);
}
setInterval(() => { if (document.visibilityState === "visible") sync(); }, 45000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
window.addEventListener("online", () => sync());

async function connect(url, code){
  url = url.trim(); code = code.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error("That doesn't look like a Google Apps Script web app link. It should start with https://script.google.com/");
  if (!code) throw new Error("Enter the shop code from the script.");
  let res;
  try { res = await post(url, {secret: code, since: 0, ops: []}); }
  catch { throw new Error("Couldn't reach the sheet. Check the link, and that the script is deployed with access for “Anyone”."); }
  if (!res?.ok) throw new Error(res?.error === "bad_code" ? "The shop code doesn't match the one in the script." : "The sheet didn't answer properly.");
  const server = res.items || [], serverIds = new Set(server.map(it => it.id));
  syncCfg = {url, code}; localStorage.setItem("syncCfg", JSON.stringify(syncCfg));
  await tx("outbox", "readwrite", s => s.clear());
  // Anything on this phone that the sheet doesn't have yet gets sent up
  const toSend = [...items.values()].filter(d => !serverIds.has(d.id));
  if (toSend.length) await tx("outbox", "readwrite", s => toSend.forEach(d => s.add({t: "restore", item: d})));
  await takeFromServer(server);
  since = res.rev || 0; localStorage.setItem("syncSince", String(since));
  await sync();
  return {fromSheet: server.filter(it => !it.deleted).length, sent: toSend.length};
}
async function disconnect(){
  syncCfg = null; syncProblem = ""; since = 0;
  localStorage.removeItem("syncCfg"); localStorage.removeItem("syncSince");
  try { await tx("outbox", "readwrite", s => s.clear()); } catch {}
  showSyncStatus();
}
const setupLink = () => `${location.origin}${location.pathname}#sync=${encodeURIComponent(btoa(JSON.stringify(syncCfg)))}`;
function parseSetupLink(text){
  const m = String(text).match(/#sync=([^\s&]+)/); if (!m) return null;
  try { const c = JSON.parse(atob(decodeURIComponent(m[1]))); return c?.url && c?.code ? c : null; } catch { return null; }
}

async function showSharing(msg){
  const waiting = syncCfg && idb ? (await outboxAll().catch(() => [])).length : 0;
  if (syncCfg){
    openSheet(`
      <h2 id="sheet-title">Sharing</h2>
      <p class="by">This phone is sharing its stock list through your Google Sheet. Changes on any connected phone show up here within a minute.</p>
      ${msg ? `<p class="note info">${esc(msg)}</p>` : ""}
      ${syncProblem && syncProblem !== "offline" ? `<p class="note dup">${esc(syncProblem)}</p>` : ""}
      <dl>
        <dt>Last checked</dt><dd>${lastSync ? esc(new Date(lastSync).toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"})) : "Not yet"}</dd>
        <dt>Waiting to send</dt><dd>${waiting}</dd>
      </dl>
      <button class="btn primary" style="width:100%;margin-bottom:10px" data-act="now">Sync now</button>
      <button class="btn ghost" style="width:100%;margin-bottom:10px" data-act="copy">Copy setup link for another phone</button>
      <div class="actions"><button class="link danger" data-act="stop">Stop sharing on this phone</button></div>`, async act => {
        if (act === "now"){ await sync(); showSharing(syncProblem ? "" : "Up to date."); }
        if (act === "copy"){
          const link = setupLink();
          try { await navigator.clipboard.writeText(link); showSharing("Setup link copied. Send it to the other phone. It contains your shop code, so only send it to people you trust."); }
          catch { prompt("Copy this setup link:", link); }
        }
        if (act === "stop" && confirm("Stop sharing on this phone? The stock list stays on this phone, but it won't update from the sheet any more.")){ await disconnect(); showSharing(); }
      });
    return;
  }
  openSheet(`
    <h2 id="sheet-title">Share between phones</h2>
    <p class="by">Connect to your Google Sheet so several phones share one stock list. The README explains how to set the sheet up.</p>
    ${msg ? `<p class="note dup">${esc(msg)}</p>` : ""}
    <form id="sf" autocomplete="off">
      <label for="s-link">Setup link, or the sheet's web app link</label>
      <input id="s-link" name="link" placeholder="https://…" required>
      <label for="s-code">Shop code (not needed with a setup link)</label>
      <input id="s-code" name="code">
      <div class="formbtns"><button type="submit" class="btn primary">Connect</button></div>
    </form>`);
  $("#sf").onsubmit = async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    const fromLink = parseSetupLink(v.link);
    busy("Connecting…", "Talking to the sheet");
    try {
      const r = await connect(fromLink?.url || v.link, fromLink?.code || v.code);
      showSharing(`Connected. ${r.fromSheet} item${r.fromSheet === 1 ? "" : "s"} came from the sheet${r.sent ? `, and ${r.sent} from this phone are being added to it` : ""}.`);
    } catch (err) { showSharing(err.message); }
  };
}

/* ================= list ================= */
let tab = "all", query = "";
function banner(msg, html){ const b = $("#banner"); if (html) b.innerHTML = html; else b.textContent = msg || ""; b.hidden = !msg && !html; }
function backupNag(){
  const last = +localStorage.getItem("lastBackup") || 0;
  if (items.size >= 10 && Date.now() - last > 14 * 864e5)
    banner(null, `${last ? "Last backup was " + fmtDate(new Date(last).toISOString()) + "." : "Nothing backed up yet."} Your stock list only lives on this phone. <button id="nag-backup">Back up now</button>`);
}
function render(){
  const all = [...items.values()];
  const inStock = all.filter(d => d.count > 0), gone = all.filter(d => !(d.count > 0));
  const copies = inStock.reduce((s, d) => s + d.count, 0);
  $("#stats").innerHTML = `<span><b>${inStock.length}</b> titles in</span><span><b>${copies}</b> copies</span><span><b>${gone.length}</b> gone</span>`;
  $("#n-all").textContent = all.length; $("#n-in").textContent = inStock.length; $("#n-gone").textContent = gone.length;

  let rows = tab === "in" ? inStock : tab === "gone" ? gone : all;
  if (query){
    const q = norm(query), raw = query.replace(/[^0-9Xx]/g, "");
    rows = rows.filter(d => norm([d.title, d.author, d.genre, d.publisher, d.notes].join(" ")).includes(q) || (raw.length > 3 && (d.barcode || "").includes(raw)));
  }
  if (tab === "gone") rows.sort((a, b) => (b.lastOut || "").localeCompare(a.lastOut || ""));
  else rows.sort((a, b) => (surname(a.author) || "zzz").localeCompare(surname(b.author) || "zzz") || norm(a.title).localeCompare(norm(b.title)));

  const list = $("#list");
  if (!rows.length){
    list.innerHTML = items.size
      ? `<li class="empty"><strong>Nothing matches</strong>Try fewer words, or check the other tabs.</li>`
      : `<li class="empty"><strong>Nothing scanned yet</strong>Tap “Scan barcode”, or “Photo or type” for books without one.</li>`;
    return;
  }
  list.innerHTML = rows.slice(0, SHOW_MAX).map(d => `
    <li><button class="row" data-id="${esc(d.id)}">
      <span class="txt"><span class="t">${esc(d.title || "Untitled")}</span><span class="a">${esc(d.author || d.kind || "")}</span></span>
      ${d.section ? `<span class="sec" title="${esc(secName(d.section))}">${esc(d.section)}</span>` : ""}
      ${d.count > 0 ? `<span class="count${d.count > 1 ? " many" : ""}" aria-label="${d.count} in stock">${d.count}</span>`
                    : `<span class="gone">Gone<br>${esc(fmtDate(d.lastOut))}</span>`}
    </button></li>`).join("") +
    (rows.length > SHOW_MAX ? `<li class="more">Showing ${SHOW_MAX} of ${rows.length}. Search to narrow it down.</li>` : "");
}
$("#list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) showItem(r.dataset.id); });
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b)); render();
}));
$("#banner").addEventListener("click", e => { if (e.target.id === "nag-backup") doBackup(); });

/* ================= sheet ================= */
let lastFocus = null, sheetToken = 0;
function openSheet(html, onClick){
  if ($("#scrim").hidden) lastFocus = document.activeElement;
  sheetToken++;
  $("#sheet").innerHTML = `<button class="close" data-act="close">Close</button>` + html;
  $("#sheet").onclick = e => { const a = e.target.closest("[data-act]")?.dataset.act; if (a === "close") closeSheet(); else if (a && onClick) onClick(a, e); };
  $("#scrim").hidden = false;
  setTimeout(() => { const h = $("#sheet h2"); if (h){ h.tabIndex = -1; h.focus(); } }, 0);
  return sheetToken;
}
function closeSheet(){ sheetToken++; $("#scrim").hidden = true; $("#sheet").innerHTML = ""; lastFocus?.focus?.(); }
const busy = (title, line) => openSheet(`<h2 id="sheet-title">${esc(title)}</h2><div class="reading"><span class="dot"></span><span id="busy-line">${esc(line)}</span></div>`);
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (!$("#scanner").hidden) stopScanner(); else if (!$("#scrim").hidden) closeSheet(); } });

function showItem(id, opts = {}){
  const d = items.get(id); if (!d) return;
  const status = d.count > 0 ? `<p class="status"><b>${d.count}</b> in stock</p>`
    : `<p class="status none">None in stock${d.lastOut ? `, last went ${esc(fmtDate(d.lastOut))}` : ""}</p>`;
  const dup = opts.scanned && d.count > 0 ? `<p class="note dup">Already ${d.count === 1 ? "one" : d.count} on the shelf. Adding it would make a duplicate.</p>`
    : opts.scanned && d.inTotal ? `<p class="note info">You've had this before. It's not in stock now.</p>` : "";
  const hist = (d.log || []).slice(0, 10).map(l => `<li class="${l.a === "out" ? "o" : ""}">${l.a === "out" ? "Went out" : "Came in"}${l.n > 1 ? ` ×${l.n}` : ""}: ${esc(fmtDate(l.d))}</li>`).join("");
  const cover = isISBN13(d.barcode || "") ? `<img src="https://covers.openlibrary.org/b/isbn/${d.barcode}-M.jpg?default=false" alt="" onerror="this.remove()">` : "";
  openSheet(`
    <div class="head">${cover}<div>
      <h2 id="sheet-title">${esc(d.title || "Untitled")}</h2>
      <p class="by">${esc(d.author || "")}${d.kind && d.kind !== "Book" ? `${d.author ? ", " : ""}${esc(d.kind)}` : ""}</p>
    </div></div>
    ${dup}${status}
    <div class="pair">
      <button class="btn out" data-act="out" ${d.count > 0 ? "" : "disabled"}>One out</button>
      <button class="btn primary" data-act="in">One in</button>
    </div>
    <dl>
      ${d.section ? `<dt>Section</dt><dd>${esc(d.section)}: ${esc(secName(d.section))}</dd>` : ""}
      ${d.genre ? `<dt>Genre</dt><dd>${esc(d.genre)}</dd>` : ""}
      ${d.publisher || d.year ? `<dt>Published</dt><dd>${esc([d.publisher, d.year].filter(Boolean).join(", "))}</dd>` : ""}
      ${d.barcode ? `<dt>Barcode</dt><dd>${esc(d.barcode)}</dd>` : ""}
      ${d.notes ? `<dt>Notes</dt><dd>${esc(d.notes)}</dd>` : ""}
      <dt>First in</dt><dd>${esc(fmtDate(d.firstIn))}</dd>
      <dt>Totals</dt><dd>${d.inTotal || 0} in, ${d.outTotal || 0} out</dd>
    </dl>
    ${hist ? `<h3>Recent</h3><ul class="hist">${hist}</ul>` : ""}
    <div class="actions">
      ${opts.scanned ? `<button class="link" data-act="next">Scan next</button>` : ""}
      <button class="link" data-act="edit">Edit details</button>
      <button class="link danger" data-act="delete">Delete record</button>
    </div>`, act => {
      if (act === "in"){ adjust(id, +1); showItem(id, opts); }
      if (act === "out"){ adjust(id, -1); showItem(id, opts); }
      if (act === "next"){ closeSheet(); startScanner(); }
      if (act === "edit") showForm({...d}, {editId: id});
      if (act === "delete" && confirm(`Delete “${d.title}” completely? Its history goes too. Use this for mistakes, not for books that sold.`)){
        deleteItem(id); closeSheet(); toast("Record deleted", () => restoreItems(d));
      }
    });
}

/* ================= add / edit form ================= */
function showForm(f, opts = {}){
  const editing = !!opts.editId;
  const match = !editing && opts.match ? `<p class="note ${opts.match.count > 0 ? "dup" : "info"}">${opts.match.count > 0 ? `Looks like one already on the shelf (${opts.match.count}).` : "Looks like one you've had before."} <button type="button" class="link" data-act="use" style="padding:0">Open that record</button></p>` : "";
  const msg = opts.msg ? `<p class="note info">${esc(opts.msg)}</p>` : "";
  openSheet(`
    <h2 id="sheet-title">${editing ? "Edit details" : "New item"}</h2>
    ${match}${msg}
    <form id="f" autocomplete="off">
      <label for="f-title">Title</label><input id="f-title" name="title" required value="${esc(f.title)}">
      <label for="f-author">Author (or maker)</label><input id="f-author" name="author" value="${esc(f.author)}">
      <div class="two">
        <div><label for="f-kind">Type</label><select id="f-kind" name="kind">${KINDS.map(k => `<option${(f.kind || "Book") === k ? " selected" : ""}>${k}</option>`).join("")}</select></div>
        <div><label for="f-section">Section</label><select id="f-section" name="section"><option value="">Not set</option>${SECTIONS.map(([c, n]) => `<option value="${c}"${f.section === c ? " selected" : ""}>${c}: ${esc(n)}</option>`).join("")}</select></div>
      </div>
      <label for="f-genre">Genre</label><input id="f-genre" name="genre" value="${esc(f.genre)}">
      <div class="two">
        <div><label for="f-publisher">Publisher</label><input id="f-publisher" name="publisher" value="${esc(f.publisher)}"></div>
        <div><label for="f-year">Year</label><input id="f-year" name="year" inputmode="numeric" maxlength="4" value="${esc(f.year)}"></div>
      </div>
      <div class="two">
        <div><label for="f-barcode">Barcode / ISBN</label><input id="f-barcode" name="barcode" inputmode="numeric" value="${esc(f.barcode)}"></div>
        ${editing ? "" : `<div><label for="f-copies">Copies</label><input id="f-copies" name="copies" type="number" min="1" max="99" value="1"></div>`}
      </div>
      <label for="f-notes">Notes</label><textarea id="f-notes" name="notes">${esc(f.notes)}</textarea>
      <div class="formbtns">
        ${editing ? "" : `<button type="button" class="btn ghost" data-act="lookup">Look it up</button>`}
        <button type="submit" class="btn primary">${editing ? "Save changes" : "Add to stock"}</button>
      </div>
    </form>`, async act => {
      if (act === "use" && opts.match) showItem(opts.match.id, {scanned: true});
      if (act === "lookup"){
        const v = Object.fromEntries(new FormData($("#f")));
        const code = v.barcode.replace(/[^0-9Xx]/g, ""), isbn = normIsbn(code) || (isISBN13(code) ? code : null);
        if (isbn){ await lookupFlow(isbn, {}); return; }
        const q = [v.title, v.author].join(" ").trim();
        if (!q){ toast("Type a title, author or ISBN first."); return; }
        const tok = busy("Looking it up…", "Searching Open Library");
        const cands = await searchBooks(q);
        if (tok !== sheetToken) return;
        showPicker(cands, {publisher: v.publisher, year: v.year, notes: v.notes, barcode: v.barcode}, "", v);
      }
    });
  $("#f").onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    for (const k of Object.keys(v)) v[k] = String(v[k]).trim();
    v.barcode = v.barcode.replace(/[^0-9Xx]/g, "");
    if (v.barcode.length === 10 && valid10(v.barcode.toUpperCase())) v.barcode = to13(v.barcode.toUpperCase());
    if (!v.title) return;
    const fields = {title: v.title, author: v.author, kind: v.kind, section: v.section, genre: v.genre, publisher: v.publisher, year: v.year, barcode: v.barcode, notes: v.notes, key: keyOf(v.title, v.author)};
    if (editing){ updateItem(opts.editId, fields); showItem(opts.editId); return; }
    const copies = Math.max(1, Math.min(99, parseInt(v.copies, 10) || 1));
    const bid = v.barcode ? "b-" + v.barcode : null;
    if (bid && items.has(bid)){ adjust(bid, copies); showItem(bid); return; }
    const id = bid || newId(), t = nowISO();
    createItem({id, ...fields, count: copies, inTotal: copies, outTotal: 0, firstIn: t, lastIn: t, lastOut: null, updated: t, log: [{a: "in", n: copies, d: t}]});
    toast(`Added: ${v.title}`, () => deleteItem(id));
    if (opts.scanned) openSheet(`<h2 id="sheet-title">Added</h2><p class="by">${esc(v.title)}</p><div class="pair"><button class="btn primary" data-act="next">Scan next</button><button class="btn ghost" data-act="close">Done</button></div>`, a => { if (a === "next"){ closeSheet(); startScanner(); } });
    else { closeSheet(); backupNag(); }
  };
}
function findMatch(f){
  if (f.barcode && items.has("b-" + f.barcode)) return items.get("b-" + f.barcode);
  if (!norm(f.title)) return null;
  const k = keyOf(f.title, f.author);
  for (const d of items.values()) if (d.key === k) return d;
  return null;
}
function showPicker(cands, extra, ocrText, typed){
  const list = cands.length ? `<p class="by">Pick the right one:</p><ul class="cands">${cands.map((c, i) =>
    `<li><button data-act="pick" data-i="${i}"><b>${esc(c.title)}</b><span>${esc([c.author, c.year].filter(Boolean).join(", "))}</span></button></li>`).join("")}</ul>`
    : `<p class="note info">No matches found online.</p>`;
  openSheet(`<h2 id="sheet-title">${cands.length ? "Is it one of these?" : "Couldn't find it"}</h2>${list}
    <button class="btn ghost" style="width:100%" data-act="self">None of these. I'll fill it in</button>
    ${ocrText ? `<details><summary>Text read from the photo</summary><pre>${esc(ocrText)}</pre></details>` : ""}`, (act, e) => {
      if (act === "pick"){
        const c = cands[+e.target.closest("[data-i]").dataset.i];
        const f = fromLookup(c, {publisher: extra.publisher, year: extra.year, notes: extra.notes, barcode: extra.barcode || c.isbn});
        const m = findMatch(f);
        if (m && f.barcode && m.id === "b-" + f.barcode){ showItem(m.id, {scanned: true}); return; }
        showForm(f, {match: m, scanned: true});
      }
      if (act === "self") showForm({title: typed?.title || "", author: typed?.author || "", publisher: extra.publisher, year: extra.year, notes: extra.notes, barcode: extra.barcode}, {scanned: true});
    });
}

/* ================= barcode → record ================= */
async function lookupFlow(code, extra){
  const bid = "b-" + code;
  if (items.has(bid)){ showItem(bid, {scanned: true}); return; }
  if (!isISBN13(code)){
    showForm({barcode: code, ...extra}, {msg: "That's not a book barcode, so there's nothing to look up. Fill in the details.", scanned: true});
    return;
  }
  const tok = busy("Looking it up…", "Checking Open Library and Google Books");
  const r = await lookupISBN(code);
  if (tok !== sheetToken) return;
  if (!r){ showForm({barcode: code, ...extra}, {msg: "Couldn't find this ISBN online. Fill in the details, or try a photo of the cover.", scanned: true}); return; }
  const f = fromLookup(r, {...extra, barcode: code});
  showForm(f, {match: findMatch(f), scanned: true});
}

/* ================= live barcode scanner ================= */
let reader = null, scanDone = false;
async function startScanner(){
  if (!window.ZXing){ toast("The scanner didn't load. Check your connection."); return; }
  scanDone = false;
  $("#scanner").hidden = false; $("#scan-msg").textContent = "Point at the barcode";
  const Z = window.ZXing;
  reader = new Z.BrowserMultiFormatReader(new Map([[Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]]]), 200);
  try {
    await reader.decodeFromConstraints({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}}, $("#video"), result => {
      if (!result || scanDone) return;
      scanDone = true;
      navigator.vibrate?.(60);
      const code = result.getText();
      stopScanner();
      lookupFlow(code, {});
    });
  } catch (e) {
    $("#scan-msg").textContent = e?.name === "NotAllowedError" ? "Camera access was blocked. Allow it in your browser settings, or use a photo instead." : "Couldn't start the camera. Use a photo instead.";
  }
}
function stopScanner(){ try { reader?.reset(); } catch {} reader = null; $("#scanner").hidden = true; }
$("#scan").addEventListener("click", startScanner);
$("#scan-cancel").addEventListener("click", stopScanner);
$("#scan-photo").addEventListener("click", () => { stopScanner(); takePhoto("cover"); });

/* ================= photo + text reading ================= */
let photoMode = "page", ocrWorker = null;
function takePhoto(mode){ photoMode = mode; $("#cam").value = ""; $("#cam").click(); }
$("#more").addEventListener("click", () => openSheet(`
  <h2 id="sheet-title">Add without scanning</h2>
  <button class="btn ghost big" data-act="page">Publisher page<small>The page inside with the publisher, date and ISBN</small></button>
  <button class="btn ghost big" data-act="cover">Cover<small>Front or back. It'll try the barcode first, then the words</small></button>
  <button class="btn ghost big" data-act="type">Type it in<small>Then tap “Look it up” to fill in the rest</small></button>`, act => {
    if (act === "page" || act === "cover"){ closeSheet(); takePhoto(act); }
    if (act === "type") showForm({});
  }));
$("#cam").addEventListener("change", e => handlePhoto(e.target.files[0]));

async function prepImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d", {willReadFrequently: true}).drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
function zxingStill(canvas){
  if (!window.ZXing) return null;
  const Z = window.ZXing, r = new Z.MultiFormatReader();
  r.setHints(new Map([[Z.DecodeHintType.TRY_HARDER, true], [Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]]]));
  for (const w of [canvas.width, 1000, 700]){
    if (w > canvas.width) continue;
    const s = w / canvas.width, c = document.createElement("canvas");
    c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
    const ctx = c.getContext("2d", {willReadFrequently: true}); ctx.drawImage(canvas, 0, 0, c.width, c.height);
    const px = ctx.getImageData(0, 0, c.width, c.height).data, lum = new Uint8ClampedArray(c.width * c.height);
    for (let i = 0, j = 0; i < px.length; i += 4, j++) lum[j] = (px[i] * 306 + px[i+1] * 601 + px[i+2] * 117) >> 10;
    try { return r.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, c.width, c.height)))).getText(); } catch {}
  }
  return null;
}
async function stillBarcode(canvas){
  if ("BarcodeDetector" in window){
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const formats = ["ean_13","ean_8","upc_a","upc_e"].filter(f => sup.includes(f));
      if (formats.length){ const r = await new BarcodeDetector({formats}).detect(canvas); if (r[0]?.rawValue) return r[0].rawValue; }
    } catch {}
  }
  return zxingStill(canvas);
}
async function readText(canvas, onProgress){
  if (!window.Tesseract) throw new Error("no-ocr");
  if (!ocrWorker){
    ocrWorker = await Tesseract.createWorker("eng", 1, {logger: m => {
      if (m.status === "loading language traineddata" || m.status === "loading tesseract core") onProgress("Getting the text reader ready (first time only)…");
      else if (m.status === "recognizing text") onProgress(`Reading the text… ${Math.round((m.progress || 0) * 100)}%`);
    }});
  }
  const {data} = await ocrWorker.recognize(canvas);
  return data.text || "";
}

async function handlePhoto(file){
  if (!file) return;
  const mode = photoMode;
  const tok = busy(mode === "page" ? "Reading the page…" : "Reading the cover…", "Opening the photo");
  const line = s => { if (tok === sheetToken){ const el = $("#busy-line"); if (el) el.textContent = s; } };
  let canvas;
  try { canvas = await prepImage(file); } catch { showForm({}, {msg: "That photo couldn't be opened. Try again, or fill in the details."}); return; }

  line("Looking for a barcode…");
  const code = await stillBarcode(canvas);
  if (tok !== sheetToken) return;
  // A barcode on a cover is the quickest route; on a publisher page we still want the date and publisher.
  if (code && mode === "cover"){ await lookupFlow(code, {}); return; }

  let text = "";
  try { text = await readText(canvas, line); }
  catch { if (tok === sheetToken) showForm({barcode: code || ""}, {msg: "The text reader didn't load. Check your connection, or fill in the details."}); return; }
  if (tok !== sheetToken) return;

  const page = parsePage(text);
  const extra = {publisher: page.publisher, year: page.year, notes: page.edition ? page.edition : ""};
  const isbns = [...new Set([code, ...findISBNs(text)].filter(c => c && isISBN13(c)))];

  for (const isbn of isbns){
    if (items.has("b-" + isbn)){ showItem("b-" + isbn, {scanned: true}); return; }
  }
  for (const isbn of isbns){
    line("Looking up the ISBN…");
    const r = await lookupISBN(isbn);
    if (tok !== sheetToken) return;
    if (r){ const f = fromLookup(r, {...extra, barcode: isbn}); showForm(f, {match: findMatch(f), scanned: true, msg: page.year || page.publisher ? `From the page: ${[page.publisher, page.year, page.edition].filter(Boolean).join(", ")}` : ""}); return; }
  }
  if (isbns.length) extra.barcode = isbns[0];

  const q = queryFromText(text);
  let cands = [];
  if (q){ line("Searching for a match…"); cands = await searchBooks(q); }
  if (tok !== sheetToken) return;
  showPicker(cands, extra, text.trim());
}

/* ================= backup / restore ================= */
function downloadFile(name, content, type){
  const blob = new Blob([content], {type}), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
function doBackup(){
  downloadFile(`shop-stock-backup-${stamp()}.json`, JSON.stringify({app: "shop-stock", version: 1, saved: nowISO(), items: [...items.values()]}), "application/json");
  localStorage.setItem("lastBackup", String(Date.now())); banner(""); toast("Backup downloaded. Keep it somewhere safe.");
}
$("#backup").addEventListener("click", doBackup);
const COLS = ["title","author","kind","genre","section","publisher","year","barcode","count","inTotal","outTotal","firstIn","lastIn","lastOut","notes"];
$("#csv").addEventListener("click", () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  downloadFile(`shop-stock-${stamp()}.csv`, [COLS.join(","), ...[...items.values()].map(d => COLS.map(c => q(d[c])).join(","))].join("\r\n"), "text/csv");
});
$("#restore").addEventListener("click", () => { $("#importer").value = ""; $("#importer").click(); });
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
$("#importer").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  const text = await file.text();
  let list = [];
  try {
    if (/^\s*\{/.test(text)){
      const j = JSON.parse(text); list = (j.items || []).filter(d => d && d.id && d.title);
    } else {
      const [head, ...rows] = parseCSV(text), idx = h => head.indexOf(h);
      list = rows.map(r => {
        const d = {}; for (const c of COLS) d[c] = idx(c) >= 0 ? (r[idx(c)] || "").trim() : "";
        for (const n of ["count","inTotal","outTotal"]) d[n] = parseInt(d[n], 10) || 0;
        d.barcode = d.barcode.replace(/[^0-9Xx]/g, "");
        d.id = d.barcode ? "b-" + d.barcode : newId(); d.key = keyOf(d.title, d.author); d.kind = d.kind || "Book";
        d.firstIn = d.firstIn || nowISO(); d.lastOut = d.lastOut || null; d.updated = nowISO(); d.log = [];
        return d;
      }).filter(d => d.title);
    }
  } catch { toast("That file couldn't be read."); return; }
  if (!list.length){ toast("No stock found in that file."); return; }
  const clash = list.filter(d => items.has(d.id)).length;
  if (!confirm(`Import ${list.length} records?${clash ? ` ${clash} will replace ones already here.` : ""}`)) return;
  restoreItems(list);
  toast(`Imported ${list.length} records.`);
});

/* ================= toast ================= */
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $("#toast-msg").textContent = msg; undoFn = undo || null;
  $("#toast-undo").hidden = !undo; $("#toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").hidden = true; undoFn = null; }, 6000);
}
$("#toast-undo").addEventListener("click", () => { const f = undoFn; undoFn = null; $("#toast").hidden = true; f?.(); });

/* ================= start ================= */
(async () => {
  render();
  try {
    idb = await openDB();
    const all = await new Promise((res, rej) => { const r = idb.transaction("items").objectStore("items").getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    for (const d of all) items.set(d.id, d);
    render(); backupNag();
    showSyncStatus();
    $("#sharing").addEventListener("click", () => showSharing());
    const link = parseSetupLink(location.hash);
    if (link){
      history.replaceState(null, "", location.pathname);
      if (confirm("Connect this phone to the shared stock list?")){
        busy("Connecting…", "Talking to the sheet");
        try { const r = await connect(link.url, link.code); showSharing(`Connected. ${r.fromSheet} item${r.fromSheet === 1 ? "" : "s"} came from the sheet.`); }
        catch (err) { showSharing(err.message); }
      }
    } else sync();
  } catch {
    banner("This browser won't let the page save anything. Try a normal (not private) window.");
    $("#scan").disabled = $("#more").disabled = true;
  }
})();
})();
</script>
