<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Stock">

<link rel="icon" href="icon-180.png">

<style>
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --ink:#1D2B2A; --muted:#5F6A66; --line:#D9DDD5;
  --green:#2E5E4E; --green-ink:#FFFFFF; --green-soft:#E3ECE7;
  --out:#9E2A3A; --out-soft:#F5E4E6; --warn-soft:#FBF1D9; --warn-ink:#6B4E0C;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131918; --surface:#1B2322; --ink:#E6ECE9; --muted:#9AA6A1; --line:#2D3836;
    --green:#7DB89F; --green-ink:#0F1F19; --green-soft:#1F3029;
    --out:#E58893; --out-soft:#3A2226; --warn-soft:#3A3120; --warn-ink:#F1D79A;
  }
}
:root[data-theme="dark"]{
  --paper:#131918; --surface:#1B2322; --ink:#E6ECE9; --muted:#9AA6A1; --line:#2D3836;
  --green:#7DB89F; --green-ink:#0F1F19; --green-soft:#1F3029;
  --out:#E58893; --out-soft:#3A2226; --warn-soft:#3A3120; --warn-ink:#F1D79A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 140px}

header h1{font:650 30px/1.1 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin:0}
.stats b{color:var(--ink);font-size:17px}

.sync{margin:6px 0 0;font-size:14px;color:var(--green)}
.sync.warn{color:var(--out)}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);font-size:15px}
.banner[hidden]{display:none}
.banner button{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline}

.search{margin:20px 0 12px}
.search input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--green);outline:none}

.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:4px}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tabs span{font-weight:400;font-size:14px}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left}
.row .txt{flex:1;min-width:0}
.row .t,.row .a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{font:500 17px/1.3 var(--serif)}
.row .a{color:var(--muted);font-size:15px}
.row .sec{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
optgroup{font-weight:700}
form label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--ink);font-size:15px;margin:10px 0 0}
form label.chk[hidden]{display:none}
form label.chk input{width:22px;height:22px;flex:none;margin:0}
.count{flex:none;min-width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-weight:700;background:var(--green-soft);color:var(--green)}
.count.many{background:var(--green);color:var(--green-ink)}
.gone{flex:none;text-align:right;font-size:13px;color:var(--out);line-height:1.2;min-width:62px}
.more{color:var(--muted);font-size:14px;padding:14px 2px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:500 19px/1.3 var(--serif);margin-bottom:6px}

.foot{margin-top:28px;display:flex;gap:6px 18px;flex-wrap:wrap}
.link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;min-height:52px}
.btn.primary{background:var(--green);color:var(--green-ink);flex:1}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.out{background:var(--out);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px}
.btn.big small{display:block;font-weight:400;color:var(--muted);font-size:14px}

.scrim{position:fixed;inset:0;background:rgba(10,15,14,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:650 23px/1.2 var(--serif);margin:0 0 4px}
.sheet .by{color:var(--muted);margin:0 0 14px}
.sheet .close{float:right;background:none;border:0;font-size:15px;color:var(--muted);padding:4px 0 8px 12px;text-decoration:underline}
.head{display:flex;gap:14px}
.head img{width:64px;height:96px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.status{font-size:19px;margin:6px 0 16px}
.status b{font-size:26px;font-family:var(--serif)}
.status.none{color:var(--out)}
.pair{display:flex;gap:10px;margin-bottom:18px}
.pair .btn{flex:1}
.note{padding:10px 12px;border-radius:10px;font-size:15px;margin:0 0 14px}
.note.dup{background:var(--warn-soft);color:var(--warn-ink)}
.note.info{background:var(--green-soft);color:var(--ink)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 16px;font-size:15px}
dt{color:var(--muted)}
dd{margin:0}
h3{font-size:15px;margin:18px 0 6px;color:var(--muted);font-weight:700}
.hist{list-style:none;margin:0 0 12px;padding:0;font-size:15px}
.hist li{padding:4px 0;border-bottom:1px dashed var(--line)}
.hist .o{color:var(--out)}
.actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.danger{color:var(--out)}
.cands{list-style:none;margin:0 0 12px;padding:0}
.cands button{width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cands b{font-family:var(--serif);font-weight:500;display:block}
.cands span{color:var(--muted);font-size:14px}
details{font-size:14px;color:var(--muted);margin:8px 0 12px}
details pre{white-space:pre-wrap;font:13px/1.4 var(--sans);background:var(--paper);padding:10px;border-radius:8px;max-height:200px;overflow:auto}

.reading{display:flex;align-items:center;gap:10px;color:var(--muted);margin:4px 0 14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

form label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 4px}
form input,form select,form textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:17px}
form textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.formbtns .btn{flex:1}

.scanner{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.scanner[hidden]{display:none}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .guide{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none}
.scanner .msg{position:absolute;left:0;right:0;top:calc(18% + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;padding:0 20px}
.scanner .ctrl{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.scanner .ctrl .btn{flex:1;background:#2b2b2b;color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:40;max-width:calc(100% - 32px);font-size:15px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* sticky search + filters */
.controls{position:sticky;top:0;z-index:4;background:var(--paper);margin:0 -16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.controls .search{margin:0 0 8px}
.controls .tabs{border-bottom:0;margin:0}
.filters{display:flex;gap:8px;padding:8px 0 10px}
.filters select{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.filters .sortnote{flex:1;font-size:14px;color:var(--muted);align-self:center}
.letter{position:sticky;top:var(--controls-h,0);font:700 13px/1 var(--sans);color:var(--green);padding:8px 2px 4px;background:var(--paper);border-bottom:1px solid var(--line);z-index:1}
.row .a .kept{color:var(--warn-ink);background:var(--warn-soft);border-radius:5px;padding:0 5px;font-size:13px;margin-left:2px}
.ver{color:var(--muted);font-size:13px;align-self:center}

/* add form */
.types{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.types button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700;color:var(--muted);min-height:36px}
.types button[aria-checked="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1;min-width:0}
.btn.small{min-height:44px;padding:8px 14px;font-size:15px;flex:none}
.btn.grow{flex:1}
.hint{font-size:14px;color:var(--muted);margin:8px 0 6px}
.hint.warn{color:var(--warn-ink)}
.secpick select{margin-bottom:8px}
.secpick select + select{margin-left:0;border-left-width:4px;border-left-color:var(--green-soft)}
.stepper{display:flex;gap:8px;max-width:220px}
.stepper input{text-align:center}
.stepper .btn{width:48px;font-size:22px;padding:0}
details.moredet{margin:16px 0 0;font-size:inherit;color:inherit;border-top:1px solid var(--line);padding-top:8px}
details.moredet summary{font-weight:700;color:var(--green);padding:8px 0;cursor:pointer}
.qr{background:#fff;padding:12px;border-radius:12px;width:min(100%,280px);margin:8px auto 12px}
.qr svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shop Stock</h1>
    <p class="stats" id="stats"></p>
    <p class="sync" id="sync" hidden></p>
  </header>
  <p class="banner" id="banner" hidden></p>

  <div class="controls" id="controls">
    <div class="search">
      <label for="q" class="vh">Search by title, author, publisher or ISBN</label>
      <input id="q" type="search" placeholder="Search title, author or ISBN…" autocomplete="off">
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="all" aria-selected="true">All <span id="n-all"></span></button>
      <button role="tab" data-tab="in" aria-selected="false">In stock <span id="n-in"></span></button>
      <button role="tab" data-tab="gone" aria-selected="false">Gone <span id="n-gone"></span></button>
    </div>
    <div class="filters">
      <select id="fsec" aria-label="Show section"></select>
      <select id="fsort" aria-label="Sort by">
        <option value="author">Author A–Z</option>
        <option value="title">Title A–Z</option>
        <option value="new">Newest first</option>
      </select>
      <span class="sortnote" id="sortnote" hidden>Most recently gone first</span>
    </div>
  </div>
  <ul class="list" id="list"></ul>

  <div class="foot">
    <button class="link" id="backup">Back up</button>
    <button class="link" id="restore">Restore or import</button>
    <button class="link" id="csv">Download spreadsheet (CSV)</button>
    <button class="link" id="sharing">Sharing</button>
    <button class="link" id="qrbtn">QR code for another phone</button>
    <span class="ver" id="ver"></span>
  </div>
</div>

<div class="bar"><div class="in">
  <button class="btn primary" id="scan">Scan</button>
  <button class="btn ghost" id="more">Add item</button>
</div></div>

<div class="scanner" id="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div class="guide"></div>
  <p class="msg" id="scan-msg">Point at the barcode</p>
  <div class="ctrl">
    <button class="btn" id="scan-cancel">Cancel</button>
    <button class="btn" id="scan-photo">Photo</button>
  </div>
</div>

<input type="file" id="cam" accept="image/*" hidden>
<input type="file" id="cam-take" accept="image/*" capture="environment" hidden>
<input type="file" id="importer" accept=".json,.csv,application/json,text/csv" hidden>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>

function applyAdjust(d, delta, at, undo){
  if (!delta) return false;
  d.count = +d.count || 0; d.inTotal = +d.inTotal || 0; d.outTotal = +d.outTotal || 0;
  d.log = Array.isArray(d.log) ? d.log : [];
  if (undo){
    const type = delta > 0 ? "out" : "in", i = d.log.findIndex(l => l.a === type);
    if (i >= 0) d.log.splice(i, 1);
    if (delta > 0){ d.count += delta; d.outTotal = Math.max(0, d.outTotal - delta); }
    else { d.count = Math.max(0, d.count + delta); d.inTotal = Math.max(0, d.inTotal + delta); }
    return true;
  }
  if (delta < 0 && d.count <= 0) return false;
  d.count = Math.max(0, d.count + delta);
  if (delta > 0){ d.inTotal += delta; d.lastIn = at; } else { d.outTotal -= delta; d.lastOut = at; }
  d.log = [{a: delta > 0 ? "in" : "out", n: Math.abs(delta), d: at}, ...d.log].slice(0, 25);
  return true;
}

}

async function post(url, payload){

    if (!r.ok) throw new Error("http " + r.status);

}
function fromServer(it){

  if (typeof d.log === "string"){ try { d.log = JSON.parse(d.log); } catch { d.log = []; } }

    const res = await post(syncCfg.url, {secret: syncCfg.code, since, ops: batch.map(b => b.op)});
    if (!res?.ok){ syncProblem = res?.error === "bad_code" ? "The shop code doesn't match the sheet. Check it under Sharing." : "The sheet sent back an error."; return; }
    if (batch.length) await tx("outbox", "readwrite", s => batch.forEach(b => s.delete(b.key)));

    const later = await outboxAll();
    await takeFromServer(res.items || [], new Set(later.map(b => b.op.id || b.op.item?.id)));
    if (res.config){
      applyConfig(res.config);
      for (const b of later) if (b.op.t === "rule"){ const k = groupKey(b.op.author); if (b.op.replace || !RULES[k]) RULES[k] = []; RULES[k].push({...b.op, clues: ""}); }

async function connect(url, code){
  url = url.trim(); code = code.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error("That doesn't look like a Google Apps Script web app link. It should start with https://script.google.com/");
  if (!code) throw new Error("Enter the shop code from the script.");
  let res;
  try { res = await post(url, {secret: code, since: 0, ops: []}); }
  catch { throw new Error("Couldn't reach the sheet. Check the link, and that the script is deployed with access for “Anyone”."); }
  if (!res?.ok) throw new Error(res?.error === "bad_code" ? "The shop code doesn't match the one in the script." : "The sheet didn't answer properly.");
  const server = res.items || [], serverIds = new Set(server.map(it => it.id));
  syncCfg = {url, code}; localStorage.setItem("syncCfg", JSON.stringify(syncCfg));
  await tx("outbox", "readwrite", s => s.clear());
  // Anything on this phone that the sheet doesn't have yet gets sent up
  const toSend = [...items.values()].filter(d => !serverIds.has(d.id));
  if (toSend.length) await tx("outbox", "readwrite", s => toSend.forEach(d => s.add({t: "restore", item: d})));
  await takeFromServer(server);
  // Author rules learned on this phone that the sheet doesn't have yet
  const serverRules = new Set((res.config?.rules || []).map(x => groupKey(x.author)));
  const myRules = Object.entries(RULES).filter(([k]) => !serverRules.has(k)).flatMap(([, rows]) => rows);
  if (myRules.length) await tx("outbox", "readwrite", st => myRules.forEach(x => st.add({t: "rule", ...x})));
  applyConfig(res.config);
  for (const x of myRules) addRule(x);
  saveRules();
  since = res.rev || 0; localStorage.setItem("syncSince", String(since));

}

  else if (sortBy === "new") rows.sort((a, b) => (b.lastIn || b.firstIn || "").localeCompare(a.lastIn || a.firstIn || ""));
  else rows.sort(byAuthor);

  const list = $("#list");
  if (!rows.length){
    list.innerHTML = items.size
      ? `<li class="empty"><strong>Nothing matches</strong>Try fewer words, another section, or the other tabs.</li>`
      : `<li class="empty"><strong>Nothing in stock yet</strong>Tap “Scan” for a book's barcode, or “Add item” for anything else.</li>`;
    return;
  }
  const letters = tab !== "gone" && sortBy !== "new" && rows.length > 12;
  let last = "", html = "";
  for (const d of rows.slice(0, SHOW_MAX)){
    if (letters){ const L = letterOf(d); if (L !== last){ html += `<li class="letter" aria-hidden="true">${L}</li>`; last = L; } }
    const where = secInfo(d.section)?.where;
    const second = [displayAuthor(d.author) || (d.kind !== "Book" ? d.kind : ""), d.subsection || (d.section ? secShort(d.section) : "")].filter(Boolean).join(" · ");
    html += `<li><button class="row" data-id="${esc(d.id)}">
      <span class="txt"><span class="t">${esc(d.title || "Untitled")}</span><span class="a">${esc(second)}${where ? ` <span class="kept">${esc(where)}</span>` : ""}</span></span>
      ${d.count > 0 ? `<span class="count${d.count > 1 ? " many" : ""}" aria-label="${d.count} in stock">${d.count}</span>`
                    : `<span class="gone">Gone<br>${esc(fmtDate(d.lastOut))}</span>`}
    </button></li>`;
  }
  if (rows.length > SHOW_MAX) html += `<li class="more">Showing ${SHOW_MAX} of ${rows.length}. Search or pick a section to narrow it down.</li>`;
  list.innerHTML = html;
  document.documentElement.style.setProperty("--controls-h", $("#controls").offsetHeight + "px");
}

      ${d.notes ? `<dt>Notes</dt><dd>${esc(d.notes)}</dd>` : ""}

// What each type of item needs. "section" is the default shelf for that type.
const TYPE_INFO = {
  "Book":        {isbn: true,  who: "Author"},
  "Puzzle book": {isbn: true,  who: "Author or publisher", section: "Games & Puzzles"},
  "Jigsaw":      {who: "Maker (e.g. Ravensburger)", section: "Jigsaws", subLabel: "Pieces"},   // jigsaws are never counted (shop disclaimer)
  "Game":        {who: "Maker", section: "Games & Puzzles"},   // games aren't checked for missing parts either
  "Magazine":    {issue: true, nameLabel: "Magazine", section: "Magazines", subLabel: "Subject"},
  "Map":         {series: true, section: "Maps & Walks > UK", isbnMore: true},
  "Other":       {}
};
const KIND_ORDER = ["Book", "Jigsaw", "Game", "Puzzle book", "Magazine", "Map", "Other"];
const COMPLETE_NOTE = "Complete (checked)";
function defaultSectionFor(kind){
  const want = TYPE_INFO[kind]?.section; if (!want) return "";
  const x = SECTIONS.find(s => s.path.endsWith(" > " + want) || s.name === want);
  return x ? x.path : "";
}
const isBookKind = k => !k || k === "Book" || k === "Puzzle book";

/* ---- section picker: one dropdown per level ---- */
function sectionTree(){
  const root = {children: new Map()};
  for (const x of SECTIONS){
    const parts = [x.group, ...x.name.split(" > ")].filter(Boolean);
    let node = root; const path = [];
    for (const p of parts){
      path.push(p);
      if (!node.children.has(p)) node.children.set(p, {label: p, path: path.join(" > "), isSection: false, children: new Map()});
      node = node.children.get(p);
    }
    node.isSection = true;
  }
  return root;
}
function mountSectionPicker(el, value, sub, kind, onChange){
  const root = sectionTree();
  const old = value && !hasSection(value) ? value : "";
  let chosen = value && hasSection(value) ? value.split(" > ") : [];
  let subVal = sub || "", otherSub = false;
  const nodeAt = () => { let n = root; for (const c of chosen){ n = n.children.get(c); if (!n) return null; } return n; };
  const path = () => { const n = nodeAt(); return n && n.isSection && chosen.length ? n.path : ""; };
  function draw(){
    let html = "", node = root;
    for (let lvl = 0; node && node.children.size; lvl++){
      const sel = chosen[lvl] || "";
      const first = lvl === 0 ? "Choose a group…" : node.isSection ? `All of ${node.label}` : "Choose…";
      html += `<select data-lvl="${lvl}" aria-label="${lvl === 0 ? "Group" : "Section"}"><option value="">${esc(first)}</option>${[...node.children.keys()].map(k => `<option${k === sel ? " selected" : ""}>${esc(k)}</option>`).join("")}</select>`;
      if (!sel) break;
      node = node.children.get(sel);
    }
    const p = path(), info = secInfo(p), subs = info?.subs || [];
    if (subs.length){
      const known = subs.includes(subVal);
      const label = TYPE_INFO[kind]?.subLabel || "Sub-section";
      html += `<label for="f-subsel">${esc(label)}</label><select id="f-subsel"><option value="">${label === "Pieces" ? "Not sure" : "None"}</option>${subs.map(x => `<option${x === subVal ? " selected" : ""}>${esc(x)}</option>`).join("")}<option value="__other"${(subVal && !known) || otherSub ? " selected" : ""}>Other…</option></select>`;
      if ((subVal && !known) || otherSub) html += `<input id="f-subother" placeholder="Type it" value="${esc(known ? "" : subVal)}" style="margin-top:6px">`;
    }
    if (info?.where) html += `<p class="hint">Kept: <b>${esc(info.where)}</b></p>`;
    if (old && !chosen.length) html += `<p class="hint warn">Was in “${esc(old)}”, which isn't in the Sections list any more. Pick a new section, or leave it.</p>`;
    if (chosen.length && !p) html += `<p class="hint">Pick one more level.</p>`;
    el.innerHTML = html;
    el.querySelectorAll("select[data-lvl]").forEach(s => s.onchange = () => {
      const lvl = +s.dataset.lvl; chosen = chosen.slice(0, lvl); if (s.value) chosen.push(s.value);
      subVal = ""; otherSub = false; draw(); onChange?.();
    });
    const ss = el.querySelector("#f-subsel");
    if (ss) ss.onchange = () => { otherSub = ss.value === "__other"; subVal = otherSub ? "" : ss.value; draw(); if (otherSub) el.querySelector("#f-subother")?.focus(); };
    const so = el.querySelector("#f-subother");
    if (so) so.oninput = () => { subVal = so.value.trim(); };
  }
  draw();
  return {
    get: () => ({section: path() || (!chosen.length ? old : ""), subsection: path() || old ? subVal : ""}),
    set: (v, s) => { chosen = v && hasSection(v) ? v.split(" > ") : []; subVal = s || ""; otherSub = false; draw(); onChange?.(); },
    incomplete: () => chosen.length > 0 && !path()
  };
}

function showForm(f, opts = {}){
  const editing = !!opts.editId;
  const kind = f.kind && TYPE_INFO[f.kind] ? f.kind : "Book", T = TYPE_INFO[kind];
  if (!editing && !f.section && T.section) f.section = defaultSectionFor(kind);

      <button type="button" class="link" data-act="addcopy">Count it as another copy of that</button> · <button type="button" class="link" data-act="use">Open that record</button></p>`);
  if (!editing && f._alternatives?.length) notes.push(`<p class="note dup">The databases disagree about the author: ${esc(f._sourceName || "one")} says ${esc(displayAuthor(f.author))}, ${esc(f._alternatives[0].source)} says ${esc(displayAuthor(f._alternatives[0].author))}. <button type="button" class="link" data-act="usealt">Use ${esc(displayAuthor(f._alternatives[0].author))}</button></p>`);
  if (!editing && f._langNote) notes.push(`<p class="note info">${esc(f._langNote)}</p>`);
  else if (!editing && f._rule) notes.push(`<p class="note info">Section filled in from the Authors list for ${esc(displayAuthor(f.author))}.</p>`);
  else if (!editing && f._ruleNote) notes.push(`<p class="note dup">${esc(f._ruleNote)}</p>`);

  const showIsbn = T.isbn, canFind = !editing && T.isbn;

  const complete = /complete \(checked\)/i.test(f.notes || "");
  const plainNotes = String(f.notes || "").replace(/\s*Complete \(checked\)\.?\s*/i, " ").trim();
  const moreFilled = !!(plainNotes || (isBookKind(kind) && (f.publisher || f.year)) || (!T.isbn && f.barcode));

  openSheet(`
    <h2 id="sheet-title">${editing ? "Edit details" : "New item"}</h2>
    ${notes.join("")}
    <div class="types" role="radiogroup" aria-label="Type">${KIND_ORDER.map(k => `<button type="button" role="radio" aria-checked="${k === kind}" data-act="kind" data-kind="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <form id="f" autocomplete="off">
      ${showIsbn ? `
      <label for="f-barcode">ISBN</label>
      <div class="inline"><input id="f-barcode" name="barcode" inputmode="numeric" value="${esc(f.barcode)}" placeholder="978…">${canFind ? `<button type="button" class="btn ghost small" data-act="lookup">Look up</button>` : ""}</div>
      ${canFind ? `<p class="hint">Or find it from a photo of the barcode, cover or publisher page:</p>
      <div class="inline"><button type="button" class="btn ghost small grow" data-act="photo-take">Take photo</button><button type="button" class="btn ghost small grow" data-act="photo-pick">Choose photo</button></div>` : ""}
      ${f.barcode && opts.found ? `<p class="hint"><button type="button" class="link" data-act="others">Not right? See other matches</button></p>` : ""}` : ""}
      <label for="f-title">${esc(T.nameLabel || "Title")}</label><input id="f-title" name="title" value="${esc(magName || "")}">
      ${T.issue ? `<label for="f-issue">Issue or date</label><input id="f-issue" name="issue" value="${esc(magIssue || "")}" placeholder="e.g. March 1998, or No. 213">` : ""}
      ${T.who ? `<label for="f-author">${esc(T.who)}</label><input id="f-author" name="author" value="${esc(f.author)}">` : ""}
      ${T.series ? `<label for="f-series">Series and number</label><input id="f-series" name="publisher" value="${esc(f.publisher)}" placeholder="e.g. OS Explorer 222">` : ""}
      ${T.complete ? `<label class="chk"><input type="checkbox" name="complete"${complete ? " checked" : ""}> ${esc(T.complete)}</label>` : ""}
      <label>Section</label>
      <div id="f-secpick" class="secpick"></div>
      <label class="chk" id="usual" hidden><input type="checkbox" name="makeUsual"> <span id="usual-text"></span></label>
      ${editing ? "" : `<label for="f-copies">Copies</label>
      <div class="stepper"><button type="button" class="btn ghost small" data-act="minus" aria-label="One fewer">−</button><input id="f-copies" name="copies" type="number" min="1" max="99" value="1" inputmode="numeric"><button type="button" class="btn ghost small" data-act="plus" aria-label="One more">+</button></div>`}
      <details class="moredet"${moreFilled ? " open" : ""}><summary>More details</summary>
        ${isBookKind(kind) ? `<div class="two">
          <div><label for="f-publisher">Publisher</label><input id="f-publisher" name="publisher" value="${esc(f.publisher)}"></div>
          <div><label for="f-year">Year</label><input id="f-year" name="year" inputmode="numeric" maxlength="4" value="${esc(f.year)}"></div>
        </div>` : `<label for="f-year">Year</label><input id="f-year" name="year" inputmode="numeric" maxlength="4" value="${esc(f.year)}">`}
        ${!T.isbn ? `<label for="f-barcode">${T.isbnMore ? "ISBN or barcode" : "Barcode"} (optional)</label><input id="f-barcode" name="barcode" inputmode="numeric" value="${esc(f.barcode)}">` : ""}

    let notes = v.notes || "";
    if (T.complete && v.complete === "on") notes = [COMPLETE_NOTE, notes].filter(Boolean).join(". ");
    return {kind, title, author: v.author || "", section, subsection, publisher: v.publisher || "", year: v.year || "",

    const existing = findByCode(v.barcode);
    if (existing){ adjust(existing.id, copies); showItem(existing.id); return; }
    const id = v.barcode ? "b-" + v.barcode : newId(), t = nowISO();
    createItem({id, ...fields, count: copies, inTotal: copies, outTotal: 0, firstIn: t, lastIn: t, lastOut: null, updated: t, log: [{a: "in", n: copies, d: t}]});
    toast(`Added: ${v.title}`, () => deleteItem(id));
    if (opts.scanned) openSheet(`<h2 id="sheet-title">Added</h2><p class="by">${esc(v.title)}</p><div class="pair"><button class="btn primary" data-act="next">Scan next</button><button class="btn ghost" data-act="close">Done</button></div>`, a => { if (a === "next"){ closeSheet(); scanAction(); } });
    else { closeSheet(); backupNag(); }
  };
}

async function lookupFromForm(kind){
  const v = Object.fromEntries(new FormData($("#f")));
  for (const k of Object.keys(v)) v[k] = String(v[k]).trim();
  const raw = v.barcode || (/^[\dXx\-\s]{9,17}$/.test(v.title) ? v.title : "");
  const digits = raw.replace(/[^0-9Xx]/g, "").toUpperCase();
  const keep = {publisher: v.publisher, year: v.year, notes: v.notes, kind};
  if (digits.length >= 8){
    const isbn = normIsbn(digits, digits.length === 9);
    if (isbn){ await lookupFlow(isbn, keep); return; }
    if (!/^97[89]/.test(digits) && digits.length !== 10){ await lookupFlow(digits, keep); return; }
    showForm({...v, kind, barcode: digits, title: v.title === raw ? "" : v.title}, {msg: `${digits} doesn't add up as an ISBN, so a digit is probably wrong. The last digit is a check digit, so a single slip anywhere shows up. Check it against the book, or type the title and author and tap Look up.`});
    return;
  }
  const q = [v.title, v.author].join(" ").trim();
  if (!q){ toast("Type an ISBN, or a title and author, first."); return; }
  const tok = busy("Looking it up…", "Searching Open Library and Google Books");
  const cands = await searchBooks(q);
  if (tok !== sheetToken) return;
  showPicker(cands, keep, "", v);
}

function findMatch(f){
  const byCode = findByCode(f.barcode);
  if (byCode) return byCode;
  if (!norm(f.title)) return null;
  const k = keyOf(f.title, f.author);
  for (const d of items.values()) if (d.key === k) return d;
  return null;
}
// cands: lookup results. edition = true when they're all for this exact ISBN (so publisher/year belong to it).
function showPicker(cands, extra, ocrText, typed, edition){
  const list = cands.length ? `<p class="by">Pick the right one:</p><ul class="cands">${cands.map((c, i) => {
    const bits = [displayAuthor(c.author), edition ? [c.publisher, c.year].filter(Boolean).join(" ") : c.firstYear ? `first published ${c.firstYear}` : "", c.source].filter(Boolean);
    return `<li><button data-act="pick" data-i="${i}"><b>${esc(c.title)}</b><span>${esc(bits.join(" · "))}</span></button></li>`; }).join("")}</ul>`
    : `<p class="note info">No matches found online.</p>`;
  openSheet(`<h2 id="sheet-title">${cands.length ? "Is it one of these?" : "Couldn't find it"}</h2>${list}
    <button class="btn ghost" style="width:100%" data-act="self">None of these. I'll fill it in</button>
    ${ocrText ? `<details><summary>Text read from the photo</summary><pre>${esc(ocrText)}</pre></details>` : ""}`, (act, e) => {
      if (act === "pick"){
        const c = cands[+e.target.closest("[data-i]").dataset.i];
        const f = fromLookup(c, {publisher: extra.publisher, year: extra.year, notes: extra.notes, barcode: extra.barcode || "", kind: extra.kind});
        const hit = findByCode(f.barcode);
        if (hit){ showItem(hit.id, {scanned: true}); return; }
        showForm(f, {match: findMatch(f), scanned: true, found: !!f.barcode});
      }
      if (act === "self") showForm({kind: extra.kind, title: typed?.title || "", author: typed?.author || "", publisher: extra.publisher, year: extra.year, notes: extra.notes, barcode: extra.barcode}, {scanned: true});
    });
}

/* ================= barcode → record ================= */
async function lookupFlow(code, extra = {}){
  const hit = findByCode(code);
  if (hit){ showItem(hit.id, {scanned: true}); return; }
  if (!isISBN13(code)){
    const why = /^977/.test(code) ? " That's a magazine (ISSN) barcode."
      : /^\d{12}$/.test(code) || /^0\d{12}$/.test(code) ? " That looks like an American shop (UPC) barcode; the ISBN is usually on the copyright page."
      : code.length < 12 ? " That's probably a misread or the small price barcode." : "";
    showForm({...extra, barcode: /^977/.test(code) ? code : "", kind: /^977/.test(code) ? "Magazine" : extra.kind}, {msg: `The barcode read as ${code}, which isn't an ISBN (book ISBNs start 978 or 979).${why}${/^977/.test(code) ? "" : " Type the ISBN from the copyright page and tap Look up, or try another photo."}`, scanned: true});
    return;
  }
  const tok = busy("Looking it up…", "Checking Open Library and Google Books");
  const r = await lookupISBN(code);
  if (tok !== sheetToken) return;
  if (r){
    const f = fromLookup(r, {...extra, barcode: code});
    showForm(f, {match: findMatch(f), scanned: true, found: true, msg: /Open Library|Google Books/.test(r.source || "") ? "" : `Details from the ${r.source}. Worth a quick check.`});
    return;
  }
  showForm({...extra, barcode: code}, {msg: "Couldn't find this ISBN in any of the free databases. Type the title and author and tap Look up, or just fill it in.", scanned: true});
}

/* ================= live barcode scanner ================= */
let reader = null, scanDone = false, lastRead = "", scanKind = "Book";
async function startScanner(kind = "Book"){
  scanKind = kind;
  if (!window.ZXing){ toast("The scanner didn't load. Check your connection."); return; }
  scanDone = false; lastRead = "";
  $("#scanner").hidden = false; $("#scan-msg").textContent = "Point at the barcode";
  const Z = window.ZXing;
  reader = new Z.BrowserMultiFormatReader(new Map([[Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.UPC_A]]]), 200);
  try {
    await reader.decodeFromConstraints({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}}, $("#video"), result => {
      if (!result || scanDone) return;
      // An ISBN is accepted at once; anything else must read the same twice, to avoid misreads
      if (!isISBN13(result.getText()) && result.getText() !== lastRead){ lastRead = result.getText(); return; }
      scanDone = true;
      navigator.vibrate?.(60);
      const code = result.getText();
      stopScanner();
      lookupFlow(code, {kind: scanKind});
    });
  } catch (e) {
    if (e?.name === "NotAllowedError" || e?.name === "SecurityError"){
      localStorage.setItem("camBlocked", "1");
      $("#scan-msg").textContent = "The live camera is blocked for this browser. Use “Photo” instead: from now on, Scan will offer photos straight away.";
    } else $("#scan-msg").textContent = "Couldn't start the live camera. Use “Photo” instead.";
  }
}
function stopScanner(){ try { reader?.reset(); } catch {} reader = null; $("#scanner").hidden = true; }
const camBlocked = () => localStorage.getItem("camBlocked") === "1";
function photoChoice(kind = "Book"){
  openSheet(`<h2 id="sheet-title">Use a photo</h2>
    <p class="by">A photo of the barcode, the cover, or the page inside with the ISBN and publisher.</p>
    <button class="btn primary big" data-act="take">Take a photo</button>
    <button class="btn ghost big" data-act="pick">Choose from your photos</button>
    ${camBlocked() ? `<div class="actions"><button class="link" data-act="live">Try the live scanner again</button></div>` : ""}`, act => {
      if (act === "take" || act === "pick"){ closeSheet(); takePhoto(act === "take", kind); }
      if (act === "live"){ localStorage.removeItem("camBlocked"); closeSheet(); startScanner(kind); }
    });
}
function scanAction(){ if (camBlocked()) photoChoice(); else startScanner(); }
$("#scan").addEventListener("click", scanAction);
$("#scan-cancel").addEventListener("click", stopScanner);
$("#scan-photo").addEventListener("click", () => { stopScanner(); photoChoice(scanKind); });
$("#more").addEventListener("click", () => showForm({kind: "Book"}));

/* ================= photo + text reading ================= */
let photoKind = "Book", ocrWorker = null;
function takePhoto(camera, kind = "Book"){
  photoKind = kind;
  const input = camera ? $("#cam-take") : $("#cam");
  input.value = ""; input.click();
}
$("#cam").addEventListener("change", e => handlePhoto(e.target.files[0]));
$("#cam-take").addEventListener("change", e => handlePhoto(e.target.files[0]));

async function prepImage(file, max = 4000){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d", {willReadFrequently: true}).drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
// Copy part of an image (fractions x, y, w, h), optionally turned 90°, scaled so its long side is about `size` pixels
function cut(src, [x, y, w, h], rot, size){
  const sw = src.width * w, sh = src.height * h, k = Math.min(1.5, size / Math.max(sw, sh));
  const c = document.createElement("canvas");
  const ow = Math.round(sw * k), oh = Math.round(sh * k);
  c.width = rot ? oh : ow; c.height = rot ? ow : oh;
  const ctx = c.getContext("2d", {willReadFrequently: true});
  if (rot){ ctx.translate(c.width, 0); ctx.rotate(Math.PI / 2); }
  ctx.drawImage(src, src.width * x, src.height * y, sw, sh, 0, 0, ow, oh);
  return c;
}
// Reads a book barcode from a photo, trying the whole image, then closer crops, then turned sideways
function zxingStill(src){
  if (!window.ZXing) return null;
  const Z = window.ZXing, r = new Z.MultiFormatReader();
  r.setHints(new Map([[Z.DecodeHintType.TRY_HARDER, true], [Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.UPC_A]]]));
  const regions = [[0,0,1,1], [0,.5,1,.5], [0,0,1,.5], [0,.25,1,.5], [.5,0,.5,1], [0,0,.5,1], [.5,.5,.5,.5], [0,.5,.5,.5]];
  // Close-up tiles (overlapping thirds) at full resolution, for small barcodes on a whole-cover photo
  const tiles = [];
  for (const y of [0, .3, .6]) for (const x of [0, .3, .6]) tiles.push([x, y, .4, .4]);
  tiles.sort((a, b) => (b[1] - a[1]) || (b[0] - a[0]));   // barcodes are usually low down on the back cover
  const tries = [];
  for (const reg of regions) tries.push([reg, 0, 1400]);
  for (const reg of tiles) tries.push([reg, 0, 1800]);
  for (const reg of regions.slice(0, 6)) tries.push([reg, 1, 1400]);
  for (const reg of tiles) tries.push([reg, 1, 1800]);
  for (const reg of regions.slice(0, 2)) tries.push([reg, 0, 900], [reg, 0, 2400]);
  for (const [reg, rot, size] of tries){
    const c = cut(src, reg, rot, size), ctx = c.getContext("2d", {willReadFrequently: true});
    const px = ctx.getImageData(0, 0, c.width, c.height).data, lum = new Uint8ClampedArray(c.width * c.height);
    for (let i = 0, j = 0; i < px.length; i += 4, j++) lum[j] = (px[i] * 306 + px[i+1] * 601 + px[i+2] * 117) >> 10;
    for (const Bin of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]){
      try { const t = r.decode(new Z.BinaryBitmap(new Bin(new Z.RGBLuminanceSource(lum, c.width, c.height)))).getText(); if (isISBN13(t) || /^977\d{10}$/.test(t)) return t; } catch {}
    }
  }
  return null;
}
async function stillBarcode(canvas){
  if ("BarcodeDetector" in window){
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const formats = ["ean_13","upc_a"].filter(f => sup.includes(f));
      if (formats.length){
        const found = await new BarcodeDetector({formats}).detect(canvas);
        const best = found.map(x => x.rawValue).find(isISBN13) || found.map(x => x.rawValue).find(x => /^977/.test(x));
        if (best) return best;
      }
    } catch {}
  }
  return zxingStill(canvas);
}
// Text reading: Google's (through the shared sheet's script) when available, otherwise the phone's own reader
async function readText(canvas, onProgress){
  if (syncCfg && localStorage.getItem("googleOcr") !== "off"){
    onProgress("Reading the text (Google)…");
    try {
      const small = cut(canvas, [0, 0, 1, 1], 0, 1800);
      const data = small.toDataURL("image/jpeg", 0.85).split(",")[1];
      const r = await post(syncCfg.url, {secret: syncCfg.code, ocr: data});
      if (r?.ok && typeof r.text === "string") return {text: r.text, via: "google"};
      if (r?.error === "drive_off") localStorage.setItem("googleOcrHint", "1");
    } catch {}
  }
  if (!window.Tesseract) throw new Error("no-ocr");
  if (!ocrWorker){
    ocrWorker = await Tesseract.createWorker("eng", 1, {logger: m => {
      if (m.status === "loading language traineddata" || m.status === "loading tesseract core") onProgress("Getting the text reader ready (first time only)…");
      else if (m.status === "recognizing text") onProgress(`Reading the text… ${Math.round((m.progress || 0) * 100)}%`);
    }});
  }
  const {data} = await ocrWorker.recognize(cut(canvas, [0, 0, 1, 1], 0, 2000));
  return {text: data.text || "", via: "phone"};
}

async function handlePhoto(file){
  if (!file) return;
  const kind = photoKind;
  const tok = busy("Reading the photo…", "Opening the photo");
  const line = s => { if (tok === sheetToken){ const el = $("#busy-line"); if (el) el.textContent = s; } };
  let canvas;
  try { canvas = await prepImage(file); } catch { showForm({kind}, {msg: "That photo couldn't be opened. Try again, or fill in the details."}); return; }

  line("Looking for a barcode…");
  const code = await stillBarcode(canvas);
  if (tok !== sheetToken) return;
  if (code && (isISBN13(code) || /^977/.test(code))){ await lookupFlow(code, {kind}); return; }

  let read;
  try { read = await readText(canvas, line); }
  catch { if (tok === sheetToken) showForm({kind}, {msg: "No barcode found, and the text reader didn't load. Check your connection, or fill in the details."}); return; }
  if (tok !== sheetToken) return;
  const text = read.text;
  const tip = read.via === "phone" && syncCfg && localStorage.getItem("googleOcrHint") ? " (Tip: turning on Google's reader in your sheet's script reads photos much better; see the README.)" : "";

  const page = parsePage(text);
  const extra = {publisher: page.publisher, year: page.year, notes: page.edition ? page.edition : "", kind};
  const isbns = [...new Set(findISBNs(text).filter(isISBN13))];
  for (const isbn of isbns){ const hit = findByCode(isbn); if (hit){ showItem(hit.id, {scanned: true}); return; } }
  for (const isbn of isbns){
    line("Looking up the ISBN…");
    const r = await lookupISBN(isbn);
    if (tok !== sheetToken) return;
    if (r){
      const f = fromLookup(r, {...extra, barcode: isbn});
      const fromPage = [page.publisher, page.year, page.edition].filter(Boolean).join(", ");
      showForm(f, {match: findMatch(f), scanned: true, found: true, msg: (fromPage ? `Read from the page: ${fromPage}.` : "") + tip});
      return;
    }
  }
  if (isbns.length) extra.barcode = isbns[0];
  const q = queryFromText(text);
  let cands = [];
  if (q){ line("Searching for a match…"); cands = await searchBooks(q); }
  if (tok !== sheetToken) return;
  if (!text.trim()){ showForm({kind}, {msg: "Couldn't find a barcode or read any words in that photo. Try again closer up, in good light, or type the details." + tip}); return; }
  showPicker(cands, extra, text.trim() + (tip ? "\n\n" + tip.trim() : ""));
}

/* ================= backup / restore ================= */
function downloadFile(name, content, type){
  const blob = new Blob([content], {type}), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
function doBackup(){
  downloadFile(`shop-stock-backup-${stamp()}.json`, JSON.stringify({app: "shop-stock", version: 1, saved: nowISO(), items: [...items.values()]}), "application/json");
  localStorage.setItem("lastBackup", String(Date.now())); banner(""); toast("Backup downloaded. Keep it somewhere safe.");
}
$("#backup").addEventListener("click", doBackup);
const COLS = ["title","author","kind","genre","section","subsection","publisher","year","barcode","altCodes","count","inTotal","outTotal","firstIn","lastIn","lastOut","notes"];
$("#csv").addEventListener("click", () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  downloadFile(`shop-stock-${stamp()}.csv`, [COLS.join(","), ...[...items.values()].map(d => COLS.map(c => q(d[c])).join(","))].join("\r\n"), "text/csv");
});
$("#restore").addEventListener("click", () => { $("#importer").value = ""; $("#importer").click(); });
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
$("#importer").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  const text = await file.text();
  let list = [];
  try {
    if (/^\s*\{/.test(text)){
      const j = JSON.parse(text); list = (j.items || []).filter(d => d && d.id && d.title);
    } else {
      const [head, ...rows] = parseCSV(text), idx = h => head.indexOf(h);
      list = rows.map(r => {
        const d = {}; for (const c of COLS) d[c] = idx(c) >= 0 ? (r[idx(c)] || "").trim() : "";
        for (const n of ["count","inTotal","outTotal"]) d[n] = parseInt(d[n], 10) || 0;
        d.barcode = d.barcode.replace(/[^0-9Xx]/g, "");
        d.id = d.barcode ? "b-" + d.barcode : newId(); d.key = keyOf(d.title, d.author); d.kind = d.kind || "Book";
        d.firstIn = d.firstIn || nowISO(); d.lastOut = d.lastOut || null; d.updated = nowISO(); d.log = [];
        return d;
      }).filter(d => d.title);
    }
  } catch { toast("That file couldn't be read."); return; }
  if (!list.length){ toast("No stock found in that file."); return; }
  const clash = list.filter(d => items.has(d.id)).length;
  if (!confirm(`Import ${list.length} records?${clash ? ` ${clash} will replace ones already here.` : ""}`)) return;
  restoreItems(list);
  toast(`Imported ${list.length} records.`);
});

/* ================= toast ================= */
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $("#toast-msg").textContent = msg; undoFn = undo || null;
  $("#toast-undo").hidden = !undo; $("#toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").hidden = true; undoFn = null; }, 6000);
}
$("#toast-undo").addEventListener("click", () => { const f = undoFn; undoFn = null; $("#toast").hidden = true; f?.(); });

/* ================= start ================= */
(async () => {
  fillSectionFilter();
  render();
  try {
    idb = await openDB();
    const all = await new Promise((res, rej) => { const r = idb.transaction("items").objectStore("items").getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const moved = [];
    for (const d of all){ const [sec, sub] = remap(d.section, d.subsection); if (sec !== (d.section || "") || sub !== (d.subsection || "")){ d.section = sec; d.subsection = sub; moved.push(d); } d.key = keyOf(d.title, d.author); items.set(d.id, d); }
    if (moved.length) await tx("items", "readwrite", st => moved.forEach(d => st.put(d)));
    render(); backupNag();
    showSyncStatus();
    $("#sharing").addEventListener("click", () => showSharing());
    const link = parseSetupLink(location.hash);
    if (link){
      history.replaceState(null, "", location.pathname);
      if (confirm("Connect this phone to the shared stock list?")){
        busy("Connecting…", "Talking to the sheet");
        try { const r = await connect(link.url, link.code); showSharing(`Connected. ${r.fromSheet} item${r.fromSheet === 1 ? "" : "s"} came from the sheet.`); }
        catch (err) { showSharing(err.message); }
      }
    } else sync();
  } catch {
    banner("This browser won't let the page save anything. Try a normal (not private) window.");
    $("#scan").disabled = $("#more").disabled = true;
  }
})();
})();
